<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para mi mejor amiga 🌻</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle, #1a0f00 0%, #000000 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.85);
      z-index: 10;
      transition: opacity 1s ease;
      cursor: pointer;
    }
    .sunflower-icon {
      font-size: 80px;
      animation: pulse 1.5s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }
    h1 {
      color: #ffd700;
      font-size: 2rem;
      margin-top: 20px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }
    p {
      color: #e0e0e0;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div id="overlay" onclick="startExperience()">
    <div class="sunflower-icon">🌻</div>
    <h1>Tengo unas flores amarillas para ti</h1>
    <p>Haz clic para abrir tu regalo ✨</p>
  </div>

  <audio id="bg-music" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
  </audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let scene, camera, renderer;
    let items = [];
    
    // Frases dedicadas para tu mejor amiga
    const messages = [
      "🌻 Feliz Día de las Flores Amarillas",
      "✨ Eres la mejor amiga del mundo",
      "💛 Gracias por tu amistad incondicional",
      "🌟 Siempre me sacas una sonrisa",
      "🌻 Nunca dejes de brillar",
      "💛 Contigo todo es mejor",
      "✨ Gracias por existir"
    ];

    function createSunflowerTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      
      // Centro marrón
      ctx.beginPath();
      ctx.arc(64, 64, 25, 0, Math.PI * 2);
      ctx.fillStyle = '#3e2723';
      ctx.fill();
      
      // Pétalos amarillos
      ctx.fillStyle = '#ffca28';
      for (let i = 0; i < 12; i++) {
        ctx.beginPath();
        ctx.ellipse(64 + Math.cos(i * Math.PI / 6) * 35, 64 + Math.sin(i * Math.PI / 6) * 35, 12, 6, i * Math.PI / 6, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(canvas);
    }

    function createTextSprite(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      
      ctx.font = 'Bold 28px sans-serif';
      ctx.fillStyle = '#ffd700';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ff6f00';
      ctx.shadowBlur = 8;
      ctx.fillText(text, 256, 64);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(6, 1.5, 1);
      return sprite;
    }

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 10;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const flowerTexture = createSunflowerTexture();
      const flowerMaterial = new THREE.SpriteMaterial({ map: flowerTexture });

      // Generar tunel de girasoles y textos
      for (let i = 0; i < 60; i++) {
        // Girasol 3D
        const flower = new THREE.Sprite(flowerMaterial);
        flower.position.x = (Math.random() - 0.5) * 25;
        flower.position.y = (Math.random() - 0.5) * 25;
        flower.position.z = -Math.random() * 80;
        flower.scale.set(2, 2, 1);
        scene.add(flower);
        items.push(flower);

        // Frase aleatoria
        if (i % 3 === 0) {
          const textMsg = messages[Math.floor(Math.random() * messages.length)];
          const textSprite = createTextSprite(textMsg);
          textSprite.position.x = (Math.random() - 0.5) * 20;
          textSprite.position.y = (Math.random() - 0.5) * 20;
          textSprite.position.z = flower.position.z + 1;
          scene.add(textSprite);
          items.push(textSprite);
        }
      }

      // Añadir luces brillantes de fondo
      const particlesGeo = new THREE.BufferGeometry();
      const count = 300;
      const posArray = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i++) {
        posArray[i] = (Math.random() - 0.5) * 50;
      }
      particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      const particlesMat = new THREE.PointsMaterial({ size: 0.1, color: 0xffeb3b });
      const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
      scene.add(particlesMesh);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);

      // Desplazamiento de los objetos hacia la cámara para dar efecto de túnel infinito
      items.forEach(item => {
        item.position.z += 0.08;
        if (item.position.z > 10) {
          item.position.z = -70;
        }
      });

      renderer.render(scene, camera);
    }

    function startExperience() {
      const overlay = document.getElementById('overlay');
      overlay.style.opacity = '0';
      setTimeout(() => overlay.style.display = 'none', 1000);
      
      const audio = document.getElementById('bg-music');
      audio.play();

      init();
    }

    window.addEventListener('resize', () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });
  </script>
</body>
</html>
