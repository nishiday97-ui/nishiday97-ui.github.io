<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas para Dian 🌻✨</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle, #1a0f00 0%, #000000 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.88);
      z-index: 10;
      transition: opacity 1s ease;
      cursor: pointer;
      text-align: center;
      padding: 20px;
    }
    .sunflower-icon {
      font-size: 80px;
      animation: pulse 1.5s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }
    h1 {
      color: #ffd700;
      font-size: 2.2rem;
      margin-top: 20px;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
    }
    p {
      color: #e0e0e0;
      font-size: 1.2rem;
      max-width: 500px;
      line-height: 1.5;
    }
    .btn-start {
      margin-top: 25px;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #1a0f00;
      background-color: #ffd700;
      border: none;
      border-radius: 25px;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
    }
  </style>
</head>
<body>

  <div id="overlay" onclick="startExperience()">
    <div class="sunflower-icon">🌻</div>
    <h1>Para la Autoproclamada Emperatriz Dian 👑</h1>
    <p>Decretado oficialmente por tu Majestad/Plebeyo Yerson. <br>¡Haz clic para ver tus Flores Amarillas! ✨</p>
    <button class="btn-start">Abrir regalo 💛</button>
  </div>

  <!-- Audio de fondo: Coldplay - Viva La Vida -->
  <audio id="bg-music" loop preload="auto">
    <source src="https://ia801503.us.archive.org/15/items/coldplay-viva-la-vida-official-video/Coldplay%20-%20Viva%20La%20Vida%20%28Official%20Video%29.mp3" type="audio/mpeg">
  </audio>

  <!-- Librería Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let scene, camera, renderer;
    let items = [];
    
    // Frases y momentos especiales
    const messages = [
      "🌻 ¡Feliz Día de las Flores Amarillas, Dian! ✨",
      "👑 Para la Emperatriz Dian de parte de Yerson 📜",
      "👻 Prohibido desaparecer como fantasma (Pacto firmado)",
      "🥬 Si me siento mal: Modo Lechuga obligatorio",
      "🍕 Permiso legal de invadir con comida 😋",
      "🐒 ¿Y mi monito de la selva? 🥹",
      "😒 La traición hermana, me cambiaste por mosquitos",
      "💛 Gracias por ser una amiga tan increíble",
      "🤣 Nivel de suerte de Dian: Tienes a Yerson de mejor amigo 😌",
      "✨ Las mejores conversaciones desastre son contigo 💛",
      "🍰 Guárdame un pedazo de torta, Plebeya 😌"
    ];

    function createSunflowerTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      
      // Centro marrón del girasol
      ctx.beginPath();
      ctx.arc(64, 64, 25, 0, Math.PI * 2);
      ctx.fillStyle = '#3e2723';
      ctx.fill();
      
      // Pétalos amarillos
      ctx.fillStyle = '#ffca28';
      for (let i = 0; i < 12; i++) {
        ctx.beginPath();
        ctx.ellipse(64 + Math.cos(i * Math.PI / 6) * 35, 64 + Math.sin(i * Math.PI / 6) * 35, 12, 6, i * Math.PI / 6, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(canvas);
    }

    function createTextSprite(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 600;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      
      ctx.font = 'Bold 24px sans-serif';
      ctx.fillStyle = '#ffd700';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ff6f00';
      ctx.shadowBlur = 10;
      ctx.fillText(text, 300, 64);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(7, 1.5, 1);
      return sprite;
    }

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 10;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const flowerTexture = createSunflowerTexture();
      const flowerMaterial = new THREE.SpriteMaterial({ map: flowerTexture });

      for (let i = 0; i < 65; i++) {
        const flower = new THREE.Sprite(flowerMaterial);
        flower.position.x = (Math.random() - 0.5) * 26;
        flower.position.y = (Math.random() - 0.5) * 26;
        flower.position.z = -Math.random() * 90;
        flower.scale.set(2.2, 2.2, 1);
        scene.add(flower);
        items.push(flower);

        if (i % 2 === 0) {
          const textMsg = messages[Math.floor(Math.random() * messages.length)];
          const textSprite = createTextSprite(textMsg);
          textSprite.position.x = (Math.random() - 0.5) * 22;
          textSprite.position.y = (Math.random() - 0.5) * 22;
          textSprite.position.z = flower.position.z + 1.5;
          scene.add(textSprite);
          items.push(textSprite);
        }
      }

      const particlesGeo = new THREE.BufferGeometry();
      const count = 350;
      const posArray = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i++) {
        posArray[i] = (Math.random() - 0.5) * 60;
      }
      particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      const particlesMat = new THREE.PointsMaterial({ size: 0.12, color: 0xffeb3b });
      const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
      scene.add(particlesMesh);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);

      items.forEach(item => {
        item.position.z += 0.08;
        if (item.position.z > 10) {
          item.position.z = -80;
        }
      });

      renderer.render(scene, camera);
    }

    function startExperience() {
      const overlay = document.getElementById('overlay');
      overlay.style.opacity = '0';
      setTimeout(() => overlay.style.display = 'none', 1000);
      
      const audio = document.getElementById('bg-music');
      audio.play().catch(e => console.log("Error al reproducir audio:", e));

      init();
    }

    window.addEventListener('resize', () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });
  </script>
</body>
</html>
